<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Stack 테스트</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.5rem; }
  .status { padding: 10px 14px; border-radius: 8px; margin: 12px 0; font-size: .95rem; }
  .ok { background: #e3f6e8; } .bad { background: #fde5e5; } .wait { background: #eee; }
  form { display: flex; gap: 8px; margin: 16px 0; }
  input[type=text] { flex: 1; padding: 10px; font-size: 1rem; }
  button { padding: 10px 16px; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; } li.done span { text-decoration: line-through; opacity: .5; }
</style>
</head>
<body>
  <h1>Frontend → FastAPI → Supabase</h1>
  <div id="api" class="status wait">API 확인 중...</div>
  <div id="db" class="status wait">DB 확인 중...</div>

  <form id="form">
    <input type="text" id="title" placeholder="할 일을 입력하세요" required>
    <button>추가</button>
  </form>
  <ul id="list"></ul>

  <script src="config.js"></script>
  <script>
    const API = window.API_URL;
    const $ = (id) => document.getElementById(id);

    function setStatus(el, ok, text) {
      el.className = "status " + (ok ? "ok" : "bad");
      el.textContent = text;
    }

    async function call(path, options) {
      const res = await fetch(API + path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!res.ok) {
        let msg = res.status;
        try { msg = (await res.json()).detail || msg; } catch (e) {}
        throw new Error(msg);
      }
      return res.status === 204 ? null : res.json();
    }

    async function check() {
      try { await call("/health"); setStatus($("api"), true, "✅ API 연결됨 (" + API + ")"); }
      catch (e) { setStatus($("api"), false, "❌ API 연결 실패: " + e.message + " (" + API + ")"); return; }
      try { await call("/health/db"); setStatus($("db"), true, "✅ Supabase 연결됨"); }
      catch (e) { setStatus($("db"), false, "❌ Supabase 오류: " + e.message); }
    }

    async function load() {
      try {
        const todos = await call("/todos");
        $("list").innerHTML = "";
        todos.forEach((t) => {
          const li = document.createElement("li");
          if (t.done) li.className = "done";
          li.innerHTML = '<input type="checkbox"' + (t.done ? " checked" : "") + '><span></span><button>삭제</button>';
          li.querySelector("span").textContent = t.title;
          li.querySelector("input").onchange = async (e) => {
            await call("/todos/" + t.id, { method: "PATCH", body: JSON.stringify({ done: e.target.checked }) });
            load();
          };
          li.querySelector("button").onclick = async () => {
            await call("/todos/" + t.id, { method: "DELETE" });
            load();
          };
          $("list").appendChild(li);
        });
      } catch (e) { /* 상태 박스에 이미 표시됨 */ }
    }

    $("form").onsubmit = async (e) => {
      e.preventDefault();
      await call("/todos", { method: "POST", body: JSON.stringify({ title: $("title").value }) });
      $("title").value = "";
      load();
    };

    check().then(load);
  </script>
</body>
</html>
